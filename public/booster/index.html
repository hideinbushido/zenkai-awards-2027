<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENKAI 2027 · Booster</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&family=Archivo:wdth,wght@62..125,700..900&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  : salle d'invocation d'un jeu de cartes premium, sombre et lumineux
   IDEA   : un vrai booster holo qu'on déchire, puis un autel où les cartes apparaissent une à une
   PICTURE: le booster puis la carte, presque plein écran, rien d'autre au centre
   COLOUR : nuit violette #07060c, or Zenkai, nacre Mirage ; la lumière vient des objets
   TYPE   : Anton (titres, comme les cartes) + Montserrat ; LAYOUT : tout centré, contrôles discrets en bas */
:root{--bg:#07060c;--ink:#efeaf7;--mute:#a59fb8;--gold:#f3c45a;--ch:min(78svh,calc((100vw - 28px)/.7166));--cw:calc(var(--ch)*.7166);--bh:min(70svh,calc((100vw - 60px)/.577))}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
canvas#three{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none}
body.mode3d canvas#three{display:block}body.mode3d #site{background:none}body.mode3d #stage,body.mode3d #bg,body.mode3d #fx,body.mode3d #veil{display:none}
canvas#bg,canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{opacity:0}
#bgv{position:fixed;left:-3%;top:-3%;width:106%;height:106%;object-fit:cover;opacity:0;pointer-events:none;filter:blur(4px) brightness(.62) saturate(1.08)}
body.mode3d #bgv{display:none}
#fx{z-index:6}
/* ---- faux site autour du booster */
#site{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 110%,#2a1340d0 0%,#120a1ee0 45%,#07060cf0 80%),url(img/mur_manga.webp) center/cover}
#site header{pointer-events:auto;display:flex;align-items:center;gap:28px;padding:18px max(4vw,18px);border-bottom:1px solid #ffffff14}
.logo{font:400 26px/1 Anton,sans-serif;letter-spacing:.02em;background:linear-gradient(180deg,#fff3c4,#f3c45a 45%,#a8621a);-webkit-background-clip:text;background-clip:text;color:transparent}
#site nav{display:flex;gap:22px;font-weight:700;font-size:14px;color:var(--mute);flex-wrap:wrap}
#site nav b{color:var(--ink)}
#site .intro{position:absolute;left:0;right:0;top:86px;text-align:center}
#site h1{margin:0;font:400 clamp(30px,5vw,48px)/1.05 Anton,sans-serif;letter-spacing:.01em}
#site .intro p{margin:6px 0 0;color:var(--mute);font-weight:600;font-size:15px}
/* ---- scène */
#stage{position:fixed;inset:0;z-index:3;display:grid;place-items:center;perspective:1400px;transform-origin:50% 50%}
#booster{position:absolute;height:var(--bh);aspect-ratio:1038/1800;top:calc(50% - var(--bh)/2 + 34px);cursor:pointer;transform-style:preserve-3d}
#booster .tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:filter .3s}
#booster img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#booster .lang{transform-origin:96% 10%}
#booster .shine,#card .shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;border-radius:3%;
  background:radial-gradient(40% 30% at var(--mx,50%) var(--my,30%),#ffffffcc,#ffffff00 70%),
  linear-gradient(115deg,transparent 30%,#ff8ad855 42%,#7ad7ff55 50%,#b6ff9b44 56%,transparent 68%) var(--sx,0%) 0/250% 100%}
#booster .shine{-webkit-mask:url(img/booster.webp) center/100% 100%;mask:url(img/booster.webp) center/100% 100%}
#booster .tearlight{position:absolute;left:4%;right:4%;top:8.4%;height:2.4%;border-radius:50%;opacity:0;filter:blur(6px);
  background:radial-gradient(closest-side,#fff,#ffe9a8 45%,#ff9cf000 100%)}
#booster .shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:7%;border-radius:50%;background:radial-gradient(closest-side,#000a,#0000);filter:blur(4px);transform:translateZ(-1px)}
#cardwrap{position:absolute;width:var(--cw);height:var(--ch);display:none}
#card{position:absolute;inset:0;cursor:pointer;transform-style:preserve-3d}
#card .tilt,#card .inner{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.face img,.face canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-user-drag:none}
.face.back img{border-radius:3.6%}
.face.back .shine{opacity:.3}
.face.back .glow{position:absolute;inset:-4%;border-radius:6%;opacity:0;mix-blend-mode:screen;background:radial-gradient(60% 45% at 50% 46%,#ffe7a0,#f3a83c88 40%,#0000 75%)}
.face.back .rays{position:absolute;left:50%;top:45.5%;width:150%;aspect-ratio:1;translate:-50% -50%;opacity:0;mix-blend-mode:screen;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#ffe2903a 0 6deg,#0000 6deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 18%,#0000 70%);mask:radial-gradient(closest-side,#000 18%,#0000 70%)}
.face.front .asm{position:absolute;inset:0;display:none}
.face.front .asm img{will-change:transform,opacity}
#card .aura{position:absolute;inset:-8%;border-radius:10%;pointer-events:none;opacity:0;filter:blur(28px);transform:translateZ(-40px)}
#ghosts{position:absolute;inset:0;pointer-events:none}
#cardwrap .beams{position:absolute;left:50%;top:50%;width:360%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;opacity:0;mix-blend-mode:screen;background-size:100% 100%}
#ghosts img{position:absolute;inset:0;width:100%;height:100%;border-radius:3.6%;mix-blend-mode:screen;opacity:0}
/* ---- voiles plein écran */
#veil{position:fixed;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none}
#wave{position:fixed;inset:-20%;z-index:7;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(115deg,#0000 35%,#ff7ad9 42%,#8b7bff 46%,#5ae3ff 50%,#b0ff9e 54%,#ffe27a 58%,#0000 66%);background-size:300% 300%}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
/* ---- textes et contrôles */
#hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;text-align:center;font-weight:700;font-size:14px;letter-spacing:.04em;color:#e9e3f5;opacity:0;pointer-events:none;text-shadow:0 2px 12px #000}
#controls{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:8px}
#controls button,.btn{font:700 13px Montserrat,sans-serif;color:var(--ink);background:#ffffff12;border:1px solid #ffffff26;border-radius:999px;padding:0 16px;height:44px;cursor:pointer;backdrop-filter:blur(8px)}
#controls button[aria-pressed=true]{background:#f3c45a26;border-color:#f3c45a88;color:#ffe6a6}
#controls button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#skip{display:none}
/* ---- récapitulatif */
#recap{position:fixed;inset:0;z-index:11;display:none;overflow:auto;padding:clamp(24px,5vw,56px) max(4vw,16px) 110px;
  background:radial-gradient(100% 70% at 50% 0%,#24133a,#0b0912 60%)}
#recap h2{margin:0 0 4px;text-align:center;font:400 clamp(32px,5vw,48px)/1.05 Anton,sans-serif}
#recap .sub{margin:0 0 28px;text-align:center;color:var(--mute);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,220px));justify-content:center;gap:22px;max-width:1240px;margin:0 auto}
#grid button{all:unset;cursor:pointer;display:block;border-radius:12px;transition:transform .25s}
#grid button:hover,#grid button:focus-visible{transform:translateY(-6px) scale(1.03)}
#grid button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#grid img{width:100%;display:block;filter:drop-shadow(0 14px 24px #000a)}
#grid span{display:block;text-align:center;margin-top:8px;font:800 12px Montserrat;letter-spacing:.18em}
.r-zenkai{color:#f6c860}.r-mirage{color:#cdb8ff}.r-spectre{color:#7fe3ff}.r-prisme{color:#ffb3ec}.r-eclat{color:#e6e8f0}
#recap .again{display:block;margin:34px auto 0}
#viewer{position:fixed;inset:0;z-index:12;display:none;place-items:center;background:#05040acc;backdrop-filter:blur(10px);perspective:1400px}
#viewer .vcard{width:var(--cw);height:var(--ch);position:relative;transform-style:preserve-3d}
#viewer canvas{position:absolute;inset:0;width:100%;height:100%}
#viewer .close{position:fixed;top:16px;right:16px}
@media (max-width:600px){#hint{bottom:calc(72px + env(safe-area-inset-bottom,0px))}#site nav{gap:14px;font-size:13px}}
@media (prefers-reduced-motion:reduce){#grid button{transition:none}}
/* ---- intégré au site Zenkai (/booster) : le site fournit l'en-tête et le titre, polices du site */
html.embed #site header,html.embed #site .intro{display:none}
html.embed body{font-family:Onest,system-ui,sans-serif}
html.embed #recap h2{font-family:Archivo,sans-serif;font-weight:900;font-stretch:62%;text-transform:uppercase}
</style>
<script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embed")</script>
</head>
<body>
<canvas id="three"></canvas>
<div id="site">
  <header><div class="logo">ZENKAI</div><nav><span>Nominés</span><span>Votes</span><b>Booster</b><span>Programme</span></nav></header>
  <div class="intro"><h1>Booster HOLO 2027</h1><p>10 cartes · 5 raretés · de ÉCLAT à ZENKAI</p></div>
</div>
<canvas id="bg"></canvas>
<video id="bgv" muted loop playsinline preload="auto" aria-hidden="true"></video>
<div id="veil"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="haze" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="hazeT" type="fractalNoise" baseFrequency="0.011 0.032" numOctaves="2" seed="4"/><feDisplacementMap id="hazeD" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="stage">
  <div id="booster" role="button" tabindex="0" aria-label="Ouvrir le booster">
    <div class="tilt">
      <div class="shadow"></div>
      <img class="corps" src="img/booster_corps.webp" alt="">
      <img class="lang" src="img/booster_languette.webp" alt="">
      <div class="shine"></div>
      <div class="tearlight"></div>
    </div>
  </div>
  <div id="cardwrap">
    <div class="beams"></div>
    <div id="ghosts"></div>
    <div id="card" role="button" tabindex="0" aria-label="Révéler la carte">
      <div class="aura"></div>
      <div class="tilt"><div class="inner">
        <div class="face back"><img src="img/dos.webp" alt=""><div class="rays"></div><div class="glow"></div><div class="shine"></div></div>
        <div class="face front"><canvas id="gl"></canvas><div class="asm"></div></div>
      </div></div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="wave"></div>
<div id="flash"></div>
<div id="hint"></div>
<div id="recap">
  <h2>Ton booster</h2><p class="sub">Touche une carte pour l'admirer</p>
  <div id="grid"></div>
  <button class="btn again" id="again">Ouvrir un autre booster</button>
</div>
<div id="viewer"><div class="vcard"><canvas id="vgl"></canvas></div><button class="btn close" id="vclose">Fermer</button></div>
<div id="controls">
  <button id="mode" aria-label="Changer de version">3D</button>
  <button id="skip">Passer</button>
  <button id="fast" aria-pressed="false">Mode rapide</button>
  <button id="snd" aria-pressed="true">Son</button>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script src="cards.js"></script>
<script src="audio.js"></script>
<script src="cardgl.js"></script>
<script src="bgv.js"></script>
<script>
{ const is3d = location.hash === "#3d";
  const mb = document.getElementById("mode"); mb.textContent = is3d ? "Version 2D" : "Version 3D";
  mb.onclick = e => { e.stopPropagation(); location.hash = is3d ? "2d" : "3d"; location.reload(); };
  const s = document.createElement("script");
  if (is3d) { document.body.classList.add("mode3d"); const g = document.createElement("script"); g.src = "booster_glb.js"; g.onload = () => document.body.appendChild(s); s.type = "module"; s.src = "app3d.js"; document.body.appendChild(g); } else s.src = "app.js";
  if (!is3d) document.body.appendChild(s); }
</script>
</body>
</html>
